name: Validate

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show tool versions
        run: |
          docker compose version
          bash --version

      - name: Shell syntax
        run: |
          bash -n tests/validate-boilerplate.sh

      - name: Validate static artifacts
        run: |
          bash tests/validate-boilerplate.sh
