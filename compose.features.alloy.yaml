services:
  alloy:
    image: grafana/alloy:${ALLOY_VERSION:-v1.16.0}
    restart: unless-stopped
    user: "0"
    depends_on:
      loki:
        condition: service_started
    command:
      - run
      - --server.http.listen-addr=0.0.0.0:12345
      - --storage.path=/var/lib/alloy/data
      - /etc/alloy/config.alloy
    environment:
      - ALLOY_LOG_LEVEL=${ALLOY_LOG_LEVEL:-info}
      - ALLOY_ENVIRONMENT=${ALLOY_ENVIRONMENT:-production}
    expose:
      - "12345"
      - "4317"
      - "4318"
    volumes:
      - ./config/alloy/config.alloy:/etc/alloy/config.alloy:ro
      - alloy-data:/var/lib/alloy/data
      - /var/run/docker.sock:/var/run/docker.sock:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:12345/-/ready >/dev/null || exit 1"]
      interval: ${ALLOY_HEALTH_INTERVAL:-30s}
      timeout: ${ALLOY_HEALTH_TIMEOUT:-5s}
      retries: ${ALLOY_HEALTH_RETRIES:-5}
      start_period: ${ALLOY_HEALTH_START_PERIOD:-30s}
    stop_grace_period: ${ALLOY_STOP_GRACE_PERIOD:-30s}
    logging:
      driver: json-file
      options:
        max-size: ${DOCKER_LOG_MAX_SIZE:-10m}
        max-file: ${DOCKER_LOG_MAX_FILE:-3}
    networks:
      - observability

volumes:
  alloy-data:
